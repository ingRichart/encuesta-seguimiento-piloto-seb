<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta del Piloto SEB</title>
  
  <!-- Bulma CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- Google Fonts para una tipografía más atractiva -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .redirect-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .logos-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .logo-img {
      max-height: 75px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.05);
    }

    .countdown-badge {
      display: inline-block;
      background-color: #eff5ff;
      color: #2970ff;
      font-weight: 700;
      font-size: 1.25rem;
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      margin: 1rem 0;
      border: 1px solid #c7d7fe;
    }

    .progress-bar-container {
      height: 6px;
      width: 100%;
      background-color: #eaecf0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 1.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2970ff, #00d1b2);
      width: 100%;
      animation: shrink 5s linear forwards;
    }

    @keyframes shrink {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>

  <script>
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbycgGNjPlg5dGmKDH02OKsjnqInLvWpS7A8wFkhdcrr5tVfWv1n8UGXtFc9zHjBqCQ/exec"; 

    let segundos = 5;

    function iniciarRedireccion() {
      const contadorEl = document.getElementById("timer");
      const btnEl = document.getElementById("btnRedirect");
      
      // Asignar link al botón manual
      btnEl.href = TARGET_URL;

      const intervalo = setInterval(() => {
        segundos--;
        if (contadorEl) {
          contadorEl.textContent = segundos;
        }

        if (segundos <= 0) {
          clearInterval(intervalo);
          window.location.href = TARGET_URL;
        }
      }, 1000);
    }

    window.onload = iniciarRedireccion;
  </script>
</head>
<body>

  <div class="redirect-card">
    
    <div class="logos-container">
      <img src="img/logo-universidad.png" alt="Logo Universidad" class="logo-img">
      <img src="img/logo-seb.png" alt="Logo Safe Exam Browser" class="logo-img">
    </div>

    <!-- TÍTULO Y DESCRIPCIÓN (Debajo de los logos) -->
    <h1 class="title is-4 has-text-grey-dark mb-3">
      Encuesta del Piloto SEB
    </h1>
<!--     
    <p class="subtitle is-6 has-text-grey">
      Serás redirigido al formulario de validación en unos momentos.
    </p> -->

    <!-- CRONÓMETRO -->
    <div class="countdown-badge">
      Redirigiendo en <span id="timer">5</span>s...
    </div>

    <!-- BARRA DE PROGRESO VISUAL -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>

    <!-- BOTÓN DE ACCESO DIRECTO -->
    <div class="mt-5">
      <a id="btnRedirect" href="#" class="button is-link is-medium is-fullwidth is-rounded">
        Ingresar ahora
      </a>
    </div>

  </div>

</body>
</html>
